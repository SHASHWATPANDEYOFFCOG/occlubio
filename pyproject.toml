[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occlubio"
version = "0.1.0"
description = "Occlusion-robust multimodal biometric face recognition pipeline"
readme = "README.md"
authors = [{ name = "Shashwat Kumar Pandey", email = "shashwatpandeyoffcog3039@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Inference path (pretrained baseline). Use onnxruntime-gpu / faiss-gpu on CUDA machines.
infer = [
    "insightface>=1.0.1",
    "onnxruntime>=1.16",
    "faiss-cpu>=1.7.4",
]
# Training path (Phase 3). Heavy; only needed to train your own model.
train = [
    # PyTorch's last Intel-Mac wheels (2.2.x) are built against NumPy 1.x.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "scikit-learn>=1.2",
]
# Platform layer (end-user web app): account registration + video-upload identification.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
]
# Report generation (REPORT.md -> REPORT.pdf), pure-Python, no system binaries.
report = [
    "markdown>=3.5",
    "xhtml2pdf>=0.2.16",
]
# Desktop shell (native window + app menu) used by the packaged macOS app.
desktop = ["pywebview>=5.0"]
dev = ["pytest>=7", "httpx>=0.27", "psutil>=5.9"]

[project.scripts]
occlubio-desktop = "occlubio.desktop:main"

[tool.setuptools.packages.find]
include = ["occlubio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
